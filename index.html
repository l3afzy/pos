<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple POS</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header>
  <h1>POS</h1>
  <nav>
    <button data-view="register" class="active">Register</button>
    <button data-view="products">Products</button>
    <button data-view="sales">Sales</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>
<div id="toast" role="status" aria-live="polite"></div>

<main>
  <section id="view-register" class="view active">
    <div class="catalog">
      <input id="search" type="search" placeholder="Search products or scan SKU…" autocomplete="off">
      <div id="product-grid" class="grid"></div>
    </div>
    <aside class="cart">
      <h2>Current Sale</h2>
      <ul id="cart-lines"></ul>
      <label>Discount %
        <input id="discount" type="number" min="0" max="100" step="1" value="0">
      </label>
      <dl id="totals"></dl>
      <div class="pay">
        <label>Cash tendered <input id="tendered" type="text" inputmode="decimal" placeholder="0.00"></label>
        <div class="row">
          <button id="pay-cash" class="primary">Pay Cash</button>
          <button id="pay-card" class="primary">Pay Card</button>
        </div>
        <button id="clear-cart" class="ghost">Clear sale</button>
      </div>
    </aside>
  </section>

  <section id="view-products" class="view">
    <h2>Products</h2>
    <form id="product-form" class="inline-form">
      <input type="hidden" name="id">
      <input name="sku" placeholder="SKU" required>
      <input name="name" placeholder="Name" required>
      <input name="price" placeholder="Price (e.g. 3.50)" inputmode="decimal" required>
      <input name="stock" type="number" min="0" step="1" placeholder="Stock" required>
      <button class="primary" type="submit">Save</button>
      <button type="reset" class="ghost">Cancel</button>
    </form>
    <table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody id="product-rows"></tbody></table>
  </section>

  <section id="view-sales" class="view">
    <h2>Sales</h2>
    <div id="summary" class="summary"></div>
    <table><thead><tr><th>ID</th><th>Date</th><th>Method</th><th>Total</th><th>Status</th><th></th></tr></thead>
      <tbody id="sale-rows"></tbody></table>
  </section>

  <section id="view-settings" class="view">
    <h2>Settings</h2>
    <form id="settings-form" class="stack">
      <label>Store name <input name="storeName" required></label>
      <label>Tax rate % <input name="taxRate" type="number" min="0" max="100" step="0.01" required></label>
      <button class="primary" type="submit">Save settings</button>
    </form>
    <p><button id="reset-data" class="danger">Reset all data</button></p>
  </section>
</main>

<dialog id="receipt-dialog">
  <pre id="receipt"></pre>
  <div class="row">
    <button onclick="window.print()">Print</button>
    <button id="close-receipt" class="primary">Close</button>
  </div>
</dialog>

<script src="src/core.js"></script>
<script src="src/app.js"></script>
</body>
</html>
